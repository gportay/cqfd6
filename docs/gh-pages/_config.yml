remote_theme: mmistakes/minimal-mistakes@4.26.2
plugins:
  - jekyll-remote-theme
  - jekyll-include-cache
locale: en
title: cqfd6
logo: "/assets/images/cqfd6-logo.png"
title_separator: "|"
name: cqfd6
description: >-
  Run your build commands in the container defined by your project, as
  if you were at home.
url: "https://gportay.github.io"
baseurl: "/cqfd6"
repository: "gportay/cqfd6"
copyright: "Gaël PORTAY"
copyright_url: "https://github.com/gportay"
enable_copy_code_button: true

markdown: kramdown
search: false

# No feed: the site has no posts, and jekyll-feed is not enabled.
atom_feed:
  hide: true

include:
  - _pages

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - cache

author:
  name: cqfd6

footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/gportay/cqfd6"

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: false
